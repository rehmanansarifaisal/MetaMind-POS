<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MetaMind Tech POS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">M</div>
        <div>
          <div class="brand-title">MetaMind Tech POS</div>
          <div class="brand-subtitle">Commercial POS Suite</div>
        </div>
      </div>
      <nav id="menu"></nav>
      <div class="sidebar-footer">
        <div class="small-muted">© MetaMind Tech POS</div>
        <div class="small-muted">Developer Name ©</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="toggleSidebar" class="icon-btn">☰</button>
          <div>
            <div id="screenTitle" class="screen-title">Dashboard</div>
            <div id="screenHint" class="screen-hint">Fast billing, inventory, reports, and more.</div>
          </div>
        </div>
        <div class="topbar-right">
          <input id="globalSearch" class="search" placeholder="Global search: product, invoice, customer..." />
          <button id="btnQuickSale" class="btn btn-primary">+ Sale</button>
          <button id="btnQuickPurchase" class="btn">+ Purchase</button>
          <button id="btnBackup" class="btn">Backup</button>
        </div>
      </header>

      <section id="alerts" class="alerts"></section>
      <section id="screen" class="screen"></section>
    </main>
  </div>

  <div id="modalRoot"></div>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
